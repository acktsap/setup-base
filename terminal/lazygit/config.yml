# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

# at the root view, the "go back" key (return, remapped to q below) quits instead.
quitOnTopLevelReturn: true

gui:
  # bigger jump per main-panel scroll keypress (default 2 lines).
  scrollHeight: 16
  # narrow the left side panels (1-4) so the main diff panel gets more width.
  # default 0.3333; lower = narrower side panels.
  sidePanelWidth: 0.2
  # reclaim space / cut noise.
  showCommandLog: false
  showRandomTip: false
  showBottomLine: false
  # set to "3" if your Ghostty font is a Nerd Font (otherwise icons show as boxes).
  nerdFontsVersion: ""
  # Match Ghostty's IntelliJ Darcula palette instead of lazygit's bright ANSI defaults.
  theme:
    activeBorderColor:
      - "#6897bb"
      - bold
    inactiveBorderColor:
      - "#555555"
    searchingActiveBorderColor:
      - "#bbb529"
      - bold
    optionsTextColor:
      - "#6897bb"
    selectedLineBgColor:
      - "#323232"
    inactiveViewSelectedLineBgColor:
      - "#2b2d30"
    cherryPickedCommitFgColor:
      - "#9876aa"
    cherryPickedCommitBgColor:
      - "#3c3f41"
    markedBaseCommitFgColor:
      - "#ffc66d"
    markedBaseCommitBgColor:
      - "#3c3f41"
    unstagedChangesColor:
      - "#cf5b56"
    defaultFgColor:
      - "#a9b7c6"

git:
  # render diffs through delta (installed by terminal/delta/setup.sh).
  # lazygit does its own paging, so disable delta's pager.
  pagers:
    - colorArg: always
      # Delta colors come from terminal/git/gitconfig; lazygit only disables nested paging.
      pager: >-
        delta --dark --paging=never

keybinding:
  universal:
    # j / k : move selection within the side panels (1-5). arrows still work.
    prevItem-alt: k
    nextItem-alt: j
    # ctrl+k/ctrl+j and ctrl+b/ctrl+f : scroll the main (diff) panel while staying on the list.
    scrollUpMain: [<c-k>, <c-b>]
    scrollDownMain: [<c-j>, <c-f>]
    # s : deliberate select/stage; keep space inert in the files panel.
    select: s
    # h / l : move focus between side panels and the main panel.
    prevBlock-alt: h
    nextBlock-alt: l
    # q : go back one level; at the root view it quits (quitOnTopLevelReturn).
    # esc no longer goes back — q replaces it. real quit is ctrl+c.
    return: q
    quit: <c-c>
    quit-alt1: <disabled>
    # enter/ctrl+l : on a file-tree directory, toggle its collapsed state.
    # Lazygit exposes selected-directory collapse/expand as one toggle action.
    goInto: [<enter>, <c-l>]
    # screen mode (enlarge/shrink focused panel) on shift-free keys instead of +/_.
    nextScreenMode: ;
    prevScreenMode: \
  files:
    findBaseCommitForFixup: <disabled>
    openStatusFilter: <disabled>
    stashAllChanges: <disabled>
  main:
    prevHunk: [<left>, h]
    nextHunk: [<right>, l]
